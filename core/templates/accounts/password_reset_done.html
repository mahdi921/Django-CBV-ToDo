{% extends 'base.html' %}
{% load static %}

{% block title %}Results{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-header">
        <h1>Check Your Email</h1>
    </div>
    <div style="text-align: center;">
        <p>If an account exists with the email you entered, we've sent instructions for resetting your password.</p>
        <br>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary">Return to Login</a>
    </div>
</div>
{% endblock %}
